<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Acme Console</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  header {
    height: 56px;
    background: #1e293b;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: 600;
  }
  .layout { display: flex; min-height: calc(100vh - 56px); }
  /* DELIBERATE DIFFERENCE #2 lives here: dev/ shifts this margin by 12px. */
  .sidebar {
    width: 200px;
    margin-left: 12px;
    background: #e2e8f0;
    padding: 20px 16px;
  }
  .sidebar a { display: block; padding: 8px 0; color: #334155; text-decoration: none; }
  main { flex: 1; padding: 32px; }
  .card {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 24px;
    max-width: 420px;
  }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #475569; }
  input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
  }
  /* DELIBERATE DIFFERENCE #1: dev/ recolours this to #dc2626. */
  button#login {
    margin-top: 18px;
    background: #dc2626;
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  /* The login card is positioned at fixed, known coordinates so
     test/probe/live-probe.mjs can dispatch synthetic clicks at exact viewport
     positions without being able to query the DOM. Do not make these relative. */
  #loginView .card { position: fixed; left: 400px; top: 180px; width: 420px; }
  #loginView #username { position: fixed; left: 420px; top: 240px; width: 320px; }
  #loginView #password { position: fixed; left: 420px; top: 300px; width: 320px; }
  #loginView button#login { position: fixed; left: 420px; top: 350px; }
  .hidden { display: none; }
  .tall { height: 1400px; background: linear-gradient(#ffffff, #e2e8f0); }
  #who { font-weight: 600; }
</style>
</head>
<body>
<header>Acme Console</header>
<div class="layout">
  <nav class="sidebar">
    <a href="#overview">Overview</a>
    <a href="#reports">Reports</a>
    <a href="#settings">Settings</a>
  </nav>
  <main>
    <section id="loginView">
      <h1>Sign in</h1>
      <div class="card">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="off" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" />
        <button id="login" type="button">Sign in</button>
      </div>
      <!-- Makes the login view scrollable. test/probe/live-probe.mjs drives
           wheel events to force real compositor frames on BOTH panes: an idle
           page composites nothing (NFR-18), so without something to scroll the
           frame-liveness assertion could not distinguish "healthy but static"
           from "frozen by background throttling". -->
      <div class="tall"></div>
    </section>

    <section id="dashboardView" class="hidden">
      <h1>Dashboard</h1>
      <p>Signed in as <span id="who"></span></p>
      <div class="card">
        <p>Signed-in session is scoped to this browser context only.</p>
        <p data-testid="timestamp">Rendered at <span id="ts"></span></p>
      </div>
      <div class="tall"></div>
    </section>
  </main>
</div>
<script>
  // JS-only login: no server, any credentials accepted. This is what makes the
  // MANUAL LOGIN path in live mode testable without a real staging environment.
  function showDashboard(user) {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('dashboardView').classList.remove('hidden');
    document.getElementById('who').textContent = user;
    // The probe asserts on this: a title change can only happen if the input
    // actually reached the RENDERER, not merely the socket.
    document.title = 'Acme Console — Dashboard';
    document.getElementById('ts').textContent = new Date().toISOString();
  }
  document.getElementById('login').addEventListener('click', function () {
    var user = document.getElementById('username').value || 'anonymous';
    sessionStorage.setItem('vr_user', user);
    showDashboard(user);
  });
  document.getElementById('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('login').click();
  });
  var existing = sessionStorage.getItem('vr_user');
  if (existing) showDashboard(existing);
</script>
</body>
</html>
